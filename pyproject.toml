[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chakranet"
version = "0.1.0"
description = "Dual-stage atmospheric physics pipeline for extreme weather anomaly tracking and diffusion downscaling"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ChakraNet Team - SIH 2026 PS 26078" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "requests>=2.28.0",
    "xmlschema>=2.3.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "serving*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
